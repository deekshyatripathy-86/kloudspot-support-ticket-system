server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/support_tickets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  jwt:
    # Replace with a secret of at least 32 bytes in local/dev environment. Do not use this default in production.
    secret: ${JWT_SECRET:local-development-secret-key-change-this-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
